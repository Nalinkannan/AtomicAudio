<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Atomic Audio: an equalizer with an orbit woven through it. -->
  <defs>
    <linearGradient id="sand" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0E0B6"/>
      <stop offset="1" stop-color="#D8BC82"/>
    </linearGradient>
  </defs>
  <path fill="url(#sand)" d="M256 32c112 0 160 0 192 32s32 80 32 192 0 160-32 192-80 32-192 32-160 0-192-32-32-80-32-192 0-160 32-192 80-32 192-32z"/>
  <!-- Back half of the orbit, behind the bars. -->
  <path fill="none" stroke="#E8761C" stroke-width="12" stroke-linecap="round"
        d="M65.8 317.8A200 70 -18 0 1 446.2 194.2"/>
  <g stroke-linecap="round" stroke-width="34">
    <line x1="100" y1="236" x2="100" y2="276" stroke="#17845F"/>
    <line x1="152" y1="178" x2="152" y2="334" stroke="#17845F"/>
    <line x1="204" y1="198" x2="204" y2="314" stroke="#17845F"/>
    <line x1="256" y1="136" x2="256" y2="376" stroke="#E8761C"/>
    <line x1="308" y1="164" x2="308" y2="348" stroke="#17845F"/>
    <line x1="360" y1="190" x2="360" y2="322" stroke="#17845F"/>
    <line x1="412" y1="222" x2="412" y2="290" stroke="#17845F"/>
  </g>
  <!-- Front half of the orbit, cut out of the bars so it reads as passing in front. -->
  <path fill="none" stroke="url(#sand)" stroke-width="28"
        d="M446.2 194.2A200 70 -18 0 1 65.8 317.8"/>
  <path fill="none" stroke="#E8761C" stroke-width="12" stroke-linecap="round"
        d="M446.2 194.2A200 70 -18 0 1 65.8 317.8"/>
</svg>
